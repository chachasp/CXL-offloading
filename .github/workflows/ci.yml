name: static-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Repository tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Verify upstream patch
        run: |
          source UPSTREAM.lock
          git clone --filter=blob:none "$DYNAMO_REPOSITORY" /tmp/dynamo
          git -C /tmp/dynamo fetch --depth 1 origin "$DYNAMO_COMMIT"
          git -C /tmp/dynamo checkout --detach "$DYNAMO_COMMIT"
          git -C /tmp/dynamo apply --check "$GITHUB_WORKSPACE/patches/dynamo-v1.3.0-cxl-numa.patch"
          git -C /tmp/dynamo apply "$GITHUB_WORKSPACE/patches/dynamo-v1.3.0-cxl-numa.patch"
          cargo fmt --manifest-path /tmp/dynamo/Cargo.toml --all -- --check
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
