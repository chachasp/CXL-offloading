# Generated with scripts/render-manifest.sh. Do not apply this template directly.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: agg-kvbm-qwen3-cxl
spec:
  pvcs:
    - create: false
      name: model-cache
    - create: false
      name: compilation-cache
  services:
    Frontend:
      componentType: frontend
      envs:
        - name: HF_HOME
          value: /home/dynamo/.cache/huggingface
      extraPodSpec:
        mainContainer:
          image: __IMAGE__
          workingDir: /workspace
          command: [python3, -m, dynamo.frontend]
          args: [--router-reset-states]
      replicas: 1
      subComponentType: null
    VllmDecodeWorker:
      componentType: worker
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: model-cache
          mountPoint: /home/dynamo/.cache/huggingface
        - name: compilation-cache
          mountPoint: /home/dynamo/.cache/vllm
          useAsCompilationCache: true
      extraPodSpec:
        mainContainer:
          image: __IMAGE__
          imagePullPolicy: Always
          workingDir: /workspace
          securityContext:
            runAsUser: 0
            capabilities:
              add: [IPC_LOCK]
          command: [python3, -m, dynamo.vllm]
          args:
            - --model
            - Qwen/Qwen3-30B-A3B-FP8
            - --tensor-parallel-size
            - "__TP__"
            - --max-model-len
            - "6000"
            - --kv-transfer-config
            - '{"kv_connector":"DynamoConnector","kv_role":"kv_both","kv_connector_module_path":"kvbm.vllm_integration.connector"}'
          env:
            - name: DYN_HEALTH_CHECK_ENABLED
              value: "false"
            - name: HF_HOME
              value: /home/dynamo/.cache/huggingface
            - name: DYN_KVBM_CPU_CACHE_GB
              value: "__CACHE_GB__"
            - name: DYN_KVBM_CXL_NUMA_NODE
              value: "__CXL_NODE__"
            - name: KVBM_CACHE_PARALLELISM
              value: tensor_parallel
            - name: DYN_KVBM_METRICS
              value: "true"
            - name: DYN_KVBM_METRICS_PORT
              value: "6880"
            - name: RUST_LOG
              value: info,kvbm_cxl=info
          ports:
            - name: kvbm
              containerPort: 6880
      replicas: 1
      resources:
        limits:
          gpu: "__GPU__"
          memory: "__MEMORY_LIMIT__"
        requests:
          gpu: "__GPU__"
          memory: "__MEMORY_REQUEST__"
